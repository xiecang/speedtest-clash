version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    main: ./cmd/node-quality
    binary: node-quality
    tags:
      - with_quic
      - with_utls
      - with_wireguard
      - with_gvisor
      - with_clash_api
    ldflags: -s -w

archives:
  - format: tar.gz
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES.md
      - LICENSES/**
      - docs/V2.md
      - docs/FILTERS.md
      - internal/filter/UPSTREAM.md
      - internal/filter/assets/*LICENSE.txt
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
    - goos: windows
      format: zip
checksum:
  name_template: 'checksums.txt'
snapshot:
  name_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
